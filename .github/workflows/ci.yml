name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test

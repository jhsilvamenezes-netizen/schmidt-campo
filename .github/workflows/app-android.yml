# Compila o app Android (APK) do SCHMIDT a cada versão publicada e deixa o arquivo pronto para baixar em
# https://github.com/jhsilvamenezes-netizen/schmidt-campo/releases/latest
name: App Android (APK)

on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/app-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar o projeto Android
        run: bash app/preparar.sh "${{ github.run_number }}"
      - name: Compilar o APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar o APK (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="$(grep -o 'versionName "[^"]*"' app/android/app/build.gradle | cut -d'"' -f2)"
          cp app/android/app/build/outputs/apk/debug/app-debug.apk SCHMIDT-Campo.apk
          TAG="app-v${VERSAO}-${{ github.run_number }}"
          gh release create "$TAG" SCHMIDT-Campo.apk \
            --title "SCHMIDT Campo ${VERSAO} (Android)" \
            --notes "App Android do SCHMIDT ${VERSAO}. Baixe o SCHMIDT-Campo.apk no celular, toque nele e permita instalar. Na 1ª vez que usar o GPS, toque em Permitir. Tiros e pontos são planejados/simulados: confira em campo." \
            --latest
      - uses: actions/upload-artifact@v4
        with:
          name: SCHMIDT-Campo-apk
          path: SCHMIDT-Campo.apk

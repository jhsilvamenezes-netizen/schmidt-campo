name: Candidata de blocos (sem deploy)

on:
  push:
    branches: [codex/auditoria-evolucao-segura]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blocos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blocos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ferramentas de auditoria
        run: |
          npm --prefix audit ci --ignore-scripts --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r audit/requirements-blocks.txt
          cd audit
          npx playwright install --with-deps chromium
      - name: Testes e build isolado
        run: |
          npm --prefix audit run test:blocks
          node audit/checkpoint.test.mjs
          npm --prefix audit test
          node scripts/build-3.mjs --check
          node scripts/build-preserved.mjs --check
          (cd audit && node app3-browser.mjs && node app3-robust-browser.mjs && node app3-map-measures-browser.mjs && node app3-perf-browser.mjs && node migration-browser.mjs)
          # 3.0 conferida acima; a partir daqui a raiz recebe a 2.5 (só no CI) para os testes da tela antiga.
          node scripts/build-preserved.mjs --root
          node scripts/build-block-candidate.mjs
      - name: Referência individual e 40 alternativas
        working-directory: audit
        run: |
          node all-fields-block-reference.mjs
          node blocks-runtime-browser.mjs
          python validate-runtime-blocks.py
          node blocks-ui-browser.mjs
          node block-map-framing-browser.mjs
          node block-map-gestures-browser.mjs
          node block-map-selection-browser.mjs
          node adjust-compare-browser.mjs
          node block-compare-browser.mjs
          node engine-swap-browser.mjs
          node night-theme-browser.mjs
          node balanced-plan-browser.mjs
          node gps-guidance-browser.mjs
          node gps-stability-browser.mjs
          node direction-measures-probe.mjs
          DIRECTION_EVIDENCE_OUT=results/direction-measures-ci.json python direction-measures.py
          node coverage-exact-export.mjs
          COVERAGE_EXACT_OUT=results/coverage-exact-ci.json python coverage-exact.py
          python voronoi-shapely.py
          node --test voronoi-exact.test.mjs
          node boundary-engine-real.mjs
          node bounded-response.test.mjs
          node satellite-map.test.mjs
          node satellite-browser.mjs
      - name: Pacote revisado sem anexos ou estados de teste
        id: package
        run: |
          # Devolve a 3.0 à raiz (a 2.5 foi montada só para os testes da tela antiga) e confere que é a versão gravada.
          node scripts/build-3.mjs --root
          git diff --exit-code -- index.html sw.js
          python scripts/package-block-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: SCHMIDT-Campo-blocos-revisada
          path: ${{ steps.package.outputs.web_zip }}
          if-no-files-found: error
          retention-days: 14
      # Não envia resultados privados, backups, GPX, screenshots ou fontes anexadas.
      # Não dispõe de permissão para Pages, merge, Releases ou assinatura Android.

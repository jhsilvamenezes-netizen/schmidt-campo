<style>

m = map(390, 844, { padTop: 130, padBot: 300 });
const s5 = `<div class="map">${m.svg}</div>${topBar()}<div class="ov"></div>

for (const [i, s] of [s1, s2, s3, s4, s5].entries()) document.getElementById('r1').insertAdjacentHTML('beforeend', `<div class="ph${i === 3 ? ' dark' : ''}">${s}</div>`);
